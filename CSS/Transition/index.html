<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform and Transition Effects</title>
    <style>
        /* Basic Box Style */
        .box {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            margin: 50px;
            transition: transform 2s;
            /* Apply transition to transform property */
        }

        /* Effects on Hover */
        .box:hover {
            transform: translateX(100px);
            /* Move 100px to the right */
        }

        .rotate-box:hover {
            transform: rotate(360deg);
            /* Rotate 360 degrees */
        }

        .rotateX-box:hover {
            transform: rotateX(360deg);
            /* Rotate around X-axis */
        }

        .rotateY-box:hover {
            transform: rotateY(360deg);
            /* Rotate around Y-axis */
        }

        .scaleX-box:hover {
            transform: scaleX(1.5);
            /* Scale horizontally */
        }

        .scale-box:hover {
            transform: scale(1.3);
            /* Scale uniformly */
        }
    </style>
</head>

<body>

    <h2>Transform and Transition Effects</h2>

    <div class="box"></div> <!-- Simple translate effect -->
    <div class="box rotate-box"></div> <!-- Rotate effect -->
    <div class="box rotateX-box"></div> <!-- RotateX effect -->
    <div class="box rotateY-box"></div> <!-- RotateY effect -->
    <div class="box scaleX-box"></div> <!-- ScaleX effect -->
    <div class="box scale-box"></div> <!-- Scale effect -->

</body>

</html>
